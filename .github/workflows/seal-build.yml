name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build jar
        run: mvn -B -V package -DskipTests -Dmaven.javadoc.skip=true
      - uses: actions/upload-artifact@v4
        with:
          name: t-digest-jar
          path: target/t-digest-3.2.jar
          if-no-files-found: error
